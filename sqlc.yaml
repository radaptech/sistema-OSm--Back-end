version: "2"
sql:
  - schema: "database/migrate"
    queries: "database/queries/"
    engine: "postgresql"
    gen:
      go:
        package: "repository"
        out: "database/repository"
        sql_package: "pgx/v5"
        emit_interface: true 
        emit_pointers_for_null_types: true
        overrides:
          - db_type: numeric
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
              pointer: true 
